services:
  postgres:
    image: postgres:16-alpine
    container_name: coddle-learn-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: coddle
      POSTGRES_PASSWORD: coddle
      POSTGRES_DB: coddle_learn
    volumes:
      - coddle_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coddle -d coddle_learn"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  coddle_pg_data:
